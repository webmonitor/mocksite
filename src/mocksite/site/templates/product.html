<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ product.name }}</title>
  </head>
  <body>
    <main id="product" data-revision="{{ revision }}">
      <h1 id="product-name">{{ product.name }}</h1>
      <p class="prices">
        {% if presentation.product_price == "empty" %}<span id="current-price"></span>
        {% elif presentation.product_price == "missing" %}
        {% elif presentation.product_price == "renamed" %}<span id="replacement-current-price">{{ product.current_price }}</span>
        {% else %}<span id="current-price">{{ product.current_price }}</span>
        {% endif %}<span id="original-price">{{ product.original_price }}</span>
        <span id="currency">{{ product.currency }}</span>
      </p>
    </main>
  </body>
</html>

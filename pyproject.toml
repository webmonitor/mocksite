[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mocksite"
version = "0.0.0"
description = "Controllable, reproducible monitoring target site for WebMonitor-Agent and WebMonitor."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
# Exact pins for what this project actually imports. The workspace conda
# environment (../.github/requirements-workspace.txt) is the union of all three
# projects; each project pins only its own needs. No lock file:
# requirements.txt is generated from this list by `uv pip compile
# --generate-hashes`.
dependencies = [
  "fastapi==0.142.2",
  "jinja2==3.1.6",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mocksite"]
include = [
  "src/mocksite/site/templates/*.html",
  "src/mocksite/site/static/assets/*.js",
  "src/mocksite/site/static/vendor/*",
]

[project.scripts]
mocksite = "mocksite.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "strict"
